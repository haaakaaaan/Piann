<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piann - Join the Network</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: radial-gradient(circle at top right, #ffffff, #e7f0fd 50%, #d1e3f8 100%);
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .signup-container {
            width: 450px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 { color: #1877f2; font-size: 32px; margin-bottom: 10px; }
        p { color: #606770; font-size: 18px; margin-bottom: 30px; }

        input, select {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #dddfe2;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: #1877f2; box-shadow: 0 0 0 2px #e7f3ff; }

        .btn-submit {
            width: 100%;
            background-color: #42b72a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover { background-color: #36a420; }

        .login-link {
            display: block;
            margin-top: 20px;
            color: #1877f2;
            text-decoration: none;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="signup-container">
    <h2>Yeni Hesap Oluştur</h2>
    <p>Hızlı ve kolaydır (It's quick and easy).</p>
    
    <form>
        <input type="text" placeholder="Adınız">
        <input type="text" placeholder="Soyadınız">
        <input type="email" placeholder="E-posta veya Cep Telefonu">
        <input type="text" placeholder="Mesleğiniz (Örn: Mühendis, Avukat)">
        <input type="text" placeholder="Şehir">
        
        <button type="button" class="btn-submit" onclick="location.href='map.html'">Kaydol ve Haritaya Git</button>
    </form>

    <a href="index.html" class="login-link">Zaten bir hesabın var mı?</a>
</div>

</body>
</html>
