<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piann - Log In or Sign Up</title>
    <style>
        body { 
            font-family: Helvetica, Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; /* Sayfanın kaymasını engeller */
        }
        
        /* Ana Kutu: Genişliği 1200px yaparak ekranı daha çok doldurmasını sağladık */
        .container { 
            display: flex; 
            width: 2040px; 
            justify-content: space-between; 
            align-items: center; 
            gap: 40px; 
        }
        
        /* Sol Taraf: Genişliği 700px'e çıkardık ki görsel devleşsin */
        .left-content { 
            width: 1190px; 
            text-align: left; 
        }
        
        .left-content h1 { 
            color: #1877f2; 
            font-size: 65px; 
            margin: 0; 
            letter-spacing: -2px; 
            font-weight: bold;
        }
        
        .left-content p { 
            font-size: 26px; 
            line-height: 32px; 
            color: #1c1e21; 
            margin-top: 10px; 
            margin-bottom: 30px; 
            font-weight: normal; 
        }
        
        /* Görsel: Genişlik %100, böylece 700px'lik alanı tamamen doldurur */
        .left-content img { 
            width: 100%; 
            height: auto;
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); /* Daha güçlü gölge ile derinlik kattık */
            display: block; 
        }

        /* Sağ Taraf: Giriş Kartı sabit kaldı */
        .right-content { 
            width: 396px; 
            flex-shrink: 0; 
        }
        
        .login-card { 
            background: white; 
            border: none; 
            border-radius: 8px; 
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1); 
            padding: 20px 16px; 
            text-align: center; 
            box-sizing: border-box; 
        }
        
        input { 
            width: 100%; 
            padding: 14px 16px; 
            margin-bottom: 12px; 
            border: 1px solid #dddfe2; 
            border-radius: 6px; 
            font-size: 17px; 
            outline: none; 
            box-sizing: border-box; 
        }
        
        input:focus { 
            border-color: #1877f2; 
            box-shadow: 0 0 0 2px #e7f3ff; 
        }
        
        .btn-login { 
            width: 100%; 
            background-color: #1877f2; 
            border: none; 
            border-radius: 6px; 
            color: white; 
            font-size: 20px; 
            font-weight: bold; 
            padding: 12px; 
            cursor: pointer; 
            margin-top: 4px; 
        }
        
        .btn-login:hover { 
            background-color: #166fe5; 
        }
        
        .forgot-pass { 
            display: block; 
            color: #1877f2; 
            font-size: 14px; 
            text-decoration: none; 
            margin: 18px 0; 
        }
        
        .divider { 
            border-bottom: 1px solid #dadde1; 
            margin-bottom: 22px; 
            margin-top: 10px; 
        }
        
        .btn-new-account { 
            background-color: #42b72a; 
            border: none; 
            border-radius: 6px; 
            color: white; 
            font-size: 17px; 
            font-weight: bold; 
            padding: 14px 18px; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block; 
        }
        
        .btn-new-account:hover { 
            background-color: #36a420; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left-content">
        <h1>Piann</h1>
        <p>Connect with your circle and open doors (kapıları açmak) with the power of your network.</p>
        <img src="world-map.png" alt="Piann Global Network">
    </div>

    <div class="right-content">
        <div class="login-card">
            <input type="text" placeholder="Email or Phone Number">
            <input type="password" placeholder="Password">
            <button class="btn-login">Log In (Giriş Yap)</button>
            <a href="#" class="forgot-pass">Forgotten password?</a>
            <div class="divider"></div>
            <a href="signup.html" class="btn-new-account">Create New Account</a>
        </div>
    </div>
</div>

</body>
</html>
