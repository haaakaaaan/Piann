<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piann - Log In or Sign Up</title>
    <style>
        /* Tüm sayfayı kapsayan ana ayarlar */
        body { 
            font-family: Helvetica, Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            display: flex; 
            justify-content: center; /* Yatayda tam ortalar */
            align-items: center;     /* Dikeyde tam ortalar */
            min-height: 100vh; 
            overflow-x: hidden;      /* Yatay kaydırmayı engeller */
        }
        
        /* Ana Konteyner: 2040px genişlik ve otomatik hizalama */
        .container { 
            display: flex; 
            width: 2040px; 
            max-width: 95%;          /* Ekran küçükse taşma yapmaz */
            justify-content: space-between; 
            align-items: center; 
            margin: 0 auto;          /* Sayfayı her zaman merkezde tutar */
            gap: 100px;              /* İki içerik arasındaki boşluk */
        }
        
        /* Sol İçerik: Görselin olduğu devasa alan */
        .left-content { 
            width: 1190px; 
            text-align: left; 
        }
        
        .left-content h1 { 
            color: #1877f2; 
            font-size: 80px;         /* Devasa başlık */
            margin: 0; 
            letter-spacing: -3px; 
            font-weight: bold;
        }
        
        .left-content p { 
            font-size: 32px;         /* Büyük ekran için büyük yazı */
            line-height: 40px; 
            color: #1c1e21; 
            margin-top: 15px; 
            margin-bottom: 40px; 
            font-weight: normal; 
        }
        
        /* Dev Görsel Ayarı */
        .left-content img { 
            width: 100%; 
            height: auto;
            border-radius: 24px;     /* Daha yumuşak köşeler */
            box-shadow: 0 15px 50px rgba(0,0,0,0.25); 
            display: block; 
        }

        /* Sağ Taraf: Giriş Kartı */
        .right-content { 
            width: 450px;            /* Kartı da bir tık büyüttük */
            flex-shrink: 0; 
        }
        
        .login-card { 
            background: white; 
            border: none; 
            border-radius: 12px; 
            box-shadow: 0 4px 12px rgba(0, 0, 0, .1), 0 16px 32px rgba(0, 0, 0, .1); 
            padding: 30px 24px; 
            text-align: center; 
            box-sizing: border-box; 
        }
        
        input { 
            width: 100%; 
            padding: 18px 16px; 
            margin-bottom: 15px; 
            border: 1px solid #dddfe2; 
            border-radius: 8px; 
            font-size: 18px; 
            outline: none; 
            box-sizing: border-box; 
        }
        
        input:focus { 
            border-color: #1877f2; 
            box-shadow: 0 0 0 2px #e7f3ff; 
        }
        
        .btn-login { 
            width: 100%; 
            background-color: #1877f2; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-size: 22px; 
            font-weight: bold; 
            padding: 14px; 
            cursor: pointer; 
            margin-top: 5px; 
        }
        
        .btn-login:hover { 
            background-color: #166fe5; 
        }
        
        .forgot-pass { 
            display: block; 
            color: #1877f2; 
            font-size: 16px; 
            text-decoration: none; 
            margin: 20px 0; 
        }
        
        .divider { 
            border-bottom: 1px solid #dadde1; 
            margin-bottom: 25px; 
            margin-top: 15px; 
        }
        
        .btn-new-account { 
            background-color: #42b72a; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            padding: 16px 20px; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left-content">
        <h1>Piann</h1>
        <p>Connect with your circle and open doors (kapıları açmak) with the power of your network.</p>
        <img src="world-map.png" alt="Piann Global Network">
    </div>

    <div class="right-content">
        <div class="login-card">
            <input type="text" placeholder="Email or Phone Number">
            <input type="password" placeholder="Password">
            <button class="btn-login">Log In (Giriş Yap)</button>
            <a href="#" class="forgot-pass">Forgotten password?</a>
            <div class="divider"></div>
            <a href="signup.html" class="btn-new-account">Create New Account</a>
        </div>
    </div>
</div>

</body>
</html>
