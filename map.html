<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piann - Interactive Network Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #f4f6f9; }

        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 500px;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .search-container input { border: none; width: 100%; padding: 10px; font-size: 18px; outline: none; }

        .info-box {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .glow-marker {
            width: 14px;
            height: 14px;
            background-color: #ff4757;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff4757;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="search-container">
    <input type="text" placeholder="İl, ilçe veya meslek ara...">
</div>

<div class="info-box" id="infoBox">İncelemek istediğiniz bölgeye tıklayın</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Haritayı Türkiye merkezli başlatıyoruz
    var map = L.map('map').setView([39.0, 35.0], 6);

    // Temiz alt zemin
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; Piann'
    }).addTo(map);

    var regionLayer;

    // Bölgelerin şeffaf mavi stili
    function defaultStyle(feature) {
        return {
            fillColor: '#1877f2',
            weight: 2,
            opacity: 1,
            color: 'white',
            dashArray: '3',
            fillOpacity: 0.25
        };
    }

    // Fareyle üzerine gelince tetiklenen parlama (Hover)
    function highlightFeature(e) {
        var layer = e.target;
        layer.setStyle({
            fillColor: '#0a66c2',
            weight: 3,
            color: '#fff',
            dashArray: '',
            fillOpacity: 0.5
        });
        layer.bringToFront();
        document.getElementById('infoBox').innerText = layer.feature.properties.name;
    }

    function resetHighlight(e) {
        regionLayer.resetStyle(e.target);
    }

    // Tıklayınca yakınlaşma mantığı (Katmanlı yüklemenin tetikleyicisi)
    function zoomToFeature(e) {
        map.fitBounds(e.target.getBounds());
        var regionId = e.target.feature.properties.id;
        var regionName = e.target.feature.properties.name;
        document.getElementById('infoBox').innerText = regionName + " İçine Girildi";
        
        // Buraya 2. Aşama geldiğinde: if(regionId == 'icanadolu') { ... il dosyasını çağır ... } diyeceğiz.
    }

    function onEachFeature(feature, layer) {
        layer.on({
            mouseover: highlightFeature,
            mouseout: resetHighlight,
            click: zoomToFeature
        });
    }

    // KENDİ PROJENDEN DOSYAYI ÇAĞIRMA (Şişmeyen akıllı kod dizini)
    // Sadece senin oluşturduğun yerel dosyaya bakıyor
    fetch('turkiye-bolgeler.json')
        .then(response => response.json())
        .then(data => {
            regionLayer = L.geoJson(data, {
                style: defaultStyle,
                onEachFeature: onEachFeature
            }).addTo(map);
        })
        .catch(err => {
            console.log("Dosya okunurken hata oluştu, yerel sunucu bekleniyor.");
        });

    // Sabit parlayan nokta (Çerkezköy)
    var customIcon = L.divIcon({ className: 'glow-marker' });
    L.marker([41.2912, 28.0017], {icon: customIcon}).addTo(map)
        .bindPopup("<b>Hakan</b><br>Üretim Mühendisi<br>Fibertex - Çerkezköy");
</script>

</body>
</html>
