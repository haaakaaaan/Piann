<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piann - Interactive Network Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #f4f6f9; }

        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 450px;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .search-container input { border: none; width: 100%; padding: 10px; font-size: 16px; outline: none; }

        .info-box {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        .glow-marker {
            width: 14px;
            height: 14px;
            background-color: #1877f2;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 12px #1877f2;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="search-container">
    <input type="text" placeholder="İl, ilçe veya meslek ara...">
</div>

<div class="info-box" id="infoBox">İncelemek istediğiniz bölgeye tıklayın</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Haritanın dünyayı sonsuz kez yana doğru tekrarlamasını (şerit olmasını) engelliyoruz
    var southWest = L.latLng(34.0, 24.0),
        northEast = L.latLng(43.0, 46.0),
        bounds = L.latLngBounds(southWest, northEast);

    var map = L.map('map', {
        center: [39.0, 35.0],
        zoom: 6,
        minZoom: 5,
        maxZoom: 11,
        maxBounds: bounds,
        maxBoundsViscosity: 1.0
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; Piann'
    }).addTo(map);

    var currentLayer;

    function style(feature) {
        return {
            fillColor: '#1877f2',
            weight: 2,
            opacity: 1,
            color: 'white',
            dashArray: '3',
            fillOpacity: 0.25
        };
    }

    function highlightFeature(e) {
        var layer = e.target;
        layer.setStyle({ fillColor: '#0a66c2', weight: 3, color: '#fff', dashArray: '', fillOpacity: 0.45 });
        layer.bringToFront();
        document.getElementById('infoBox').innerText = layer.feature.properties.name || layer.feature.properties.NAME_1 || "Bölge";
    }

    function resetHighlight(e) {
        currentLayer.resetStyle(e.target);
    }

    // Tıklayınca o bölgenin bağımsız küçük dosyasına gitme mantığı
    function zoomToFeature(e) {
        map.fitBounds(e.target.getBounds());
        var properties = e.target.feature.properties;
        var regionId = properties.id;
        var regionName = properties.name || "Bölge";
        
        document.getElementById('infoBox').innerText = regionName + " Yükleniyor...";

        // Sadece tıkladığımız bölgenin küçük yapboz parçasını çağırıyoruz
        if (regionId === 'marmara') {
            loadSpecificRegion('bolge-marmara.json');
        }
    }

    function onEachFeature(feature, layer) {
        layer.on({ mouseover: highlightFeature, mouseout: resetHighlight, click: zoomToFeature });
    }

    function loadSpecificRegion(jsonFile) {
        fetch(jsonFile)
            .then(res => res.json())
            .then(data => {
                if (currentLayer) { map.removeLayer(currentLayer); }
                currentLayer = L.geoJson(data, { style: style, onEachFeature: onEachFeature }).addTo(map);
            })
            .catch(err => console.log("Bölge dosyası yüklenemedi. Henüz oluşturulmamış olabilir."));
    }

    // İLK AÇILIŞ: turkiye-bolgeler.json dosyasından ana bölgeleri okur
    fetch('turkiye-bolgeler.json')
        .then(res => res.json())
        .then(data => {
            currentLayer = L.geoJson(data, { style: style, onEachFeature: onEachFeature }).addTo(map);
        });

    var customIcon = L.divIcon({ className: 'glow-marker' });
    L.marker([41.2912, 28.0017], {icon: customIcon}).addTo(map)
        .bindPopup("<b>Hakan</b><br>Üretim Mühendisi<br>Fibertex - Çerkezköy");
</script>

</body>
</html>
