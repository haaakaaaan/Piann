<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piann - Interactive Network Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #f4f6f9; }

        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 500px;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .search-container input {
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 18px;
            outline: none;
        }

        .info-box {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .glow-marker {
            width: 14px;
            height: 14px;
            background-color: #ff4757;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff4757;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="search-container">
    <input type="text" placeholder="İl, ilçe veya meslek ara...">
</div>

<div class="info-box" id="infoBox">İncelemek istediğiniz bölgeye tıklayın</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1. Haritayı Türkiye merkezli başlatıyoruz
    var map = L.map('map').setView([39.0, 35.0], 6);

    // Temiz, kurumsal ve kasmayan harita zemini
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; Piann'
    }).addTo(map);

    // 2. Bölgelerin Varsayılan Yapboz Rengi (Mavi dumanlı stil)
    function defaultStyle(feature) {
        return {
            fillColor: '#1877f2',
            weight: 2,
            opacity: 1,
            color: 'white',
            dashArray: '3',
            fillOpacity: 0.25
        };
    }

    // 3. Fare Üzerine Gelince Tetiklenen Parlama (Hover)
    function highlightFeature(e) {
        var layer = e.target;
        layer.setStyle({
            fillColor: '#0a66c2',
            weight: 3,
            color: '#fff',
            dashArray: '',
            fillOpacity: 0.5
        });
        layer.bringToFront();
        document.getElementById('infoBox').innerText = layer.feature.properties.name;
    }

    function resetHighlight(e) {
        regionLayer.resetStyle(e.target);
    }

    // 4. Tıklayınca O Bölgeye Kilitlenme (Yapbozun içine giriş)
    function zoomToFeature(e) {
        map.fitBounds(e.target.getBounds());
        var regionName = e.target.feature.properties.name;
        document.getElementById('infoBox').innerText = regionName + " İçine Girildi";
        
        // Buradan sonra il seviyesindeki yapboz parçalarını çağıracağız (Aşama 2)
    }

    function onEachFeature(feature, layer) {
        layer.on({
            mouseover: highlightFeature,
            mouseout: resetHighlight,
            click: zoomToFeature
        });
    }

    // 5. İNTERNETE BAĞIMLI OLMAYAN BÖLGE YAPBOZ PARÇALARI (GEOJSON GÖMÜLÜ)
    var turkeyRegions = {
        "type": "FeatureCollection",
        "features": [
            {
                "type": "Feature",
                "properties": {"name": "Marmara Bölgesi"},
                "geometry": {
                    "type": "Polygon",
                    "coordinates": [[
                        [26.0, 40.0], [27.0, 41.5], [29.0, 42.0], [31.5, 41.0], [30.5, 40.0], [29.0, 40.0], [27.5, 39.5], [26.0, 40.0]
                    ]]
                }
            },
            {
                "type": "Feature",
                "properties": {"name": "İç Anadolu Bölgesi"},
                "geometry": {
                    "type": "Polygon",
                    "coordinates": [[
                        [31.5, 41.0], [35.0, 41.5], [37.0, 40.5], [38.5, 39.5], [36.0, 37.5], [32.5, 37.5], [31.0, 39.0], [31.5, 41.0]
                    ]]
                }
            },
            {
                "type": "Feature",
                "properties": {"name": "Ege Bölgesi"},
                "geometry": {
                    "type": "Polygon",
                    "coordinates": [[
                        [26.0, 40.0], [27.5, 39.5], [29.0, 40.0], [30.5, 39.0], [30.0, 37.0], [27.0, 36.5], [26.0, 38.5], [26.0, 40.0]
                    ]]
                }
            }
        ]
    };

    var regionLayer = L.geoJson(turkeyRegions, {
        style: defaultStyle,
        onEachFeature: onEachFeature
    }).addTo(map);

    // 6. İlk Parlayan Örnek Noktamız (Çerkezköy)
    var customIcon = L.divIcon({ className: 'glow-marker' });
    L.marker([41.2912, 28.0017], {icon: customIcon}).addTo(map)
        .bindPopup("<b>Hakan</b><br>Üretim Mühendisi<br>Fibertex - Çerkezköy");
</script>

</body>
</html>
