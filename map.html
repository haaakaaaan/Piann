<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piann - Interactive Network Map</title>
    <style>
        /* Sayfa yapısını ve dikey/yatay kaydırmaları tamamen kilitliyoruz */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%;
            overflow: hidden; /* Sayfanın kendisinin aşağı yukarı kaymasını kökten engeller */
            background: #eef2f7;
        }
        
        /* Harita kutusunu ekran boyutuna tam olarak çiviliyoruz */
        #map { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important; 
            height: 100% !important; 
        }

        /* Üst Profesyonel Arama Çubuğu */
        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }
        .search-container input {
            border: none;
            width: 100%;
            padding: 5px 10px;
            font-size: 16px;
            outline: none;
        }

        /* Bilgi Kutusu */
        .info-box {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 14px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="search-container">
    <input type="text" placeholder="İl, ilçe veya meslek ara...">
</div>

<div class="info-box" id="infoBox">Piann Profesyonel Harita Altyapısı Aktif</div>

<div id="map"></div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAqubeLzV-_ZLHLMvm82UcuZKYbbWudiVY&callback=initMap" async defer></script>

<script>
    var map;
    var infoBox = document.getElementById('infoBox');

    function initMap() {
        // Haritayı Türkiye merkezli ve dikey taşmaları engelleyecek şekilde başlatıyoruz
        map = new google.maps.Map(document.getElementById('map'), {
            center: {lat: 39.0, lng: 35.0}, 
            zoom: 6,
            disableDefaultUI: true, // Kalabalık butonları gizle
            zoomControl: true,      // Sadece zoom butonunu açık bırak
            gestureHandling: 'greedy' // Mobil cihazlarda haritanın daha akıcı hareket etmesini sağlar
        });

        // Noktalarımızı haritaya yerleştiriyoruz
        addGlowMarker({lat: 41.2912, lng: 28.0017}, "Hakan (hako)", "Üretim Mühendisi / Fibertex - Çerkezköy");
        addGlowMarker({lat: 41.0082, lng: 28.9784}, "Melike", "Operasyon Yöneticisi / Piann - İstanbul");
    }

    // Profesyonel Kurumsal Mavi Noktaları Çizen Fonksiyon
    function addGlowMarker(position, title, details) {
        var marker = new google.maps.Marker({
            position: position,
            map: map,
            title: title,
            icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 7,
                fillColor: '#1877f2', // Kurumsal Mavi
                fillOpacity: 0.9,
                strokeWeight: 2,
                strokeColor: '#ffffff' // Dış beyaz çeper
            }
        });

        var infoWindow = new google.maps.InfoWindow({
            content: '<div style="font-family:Segoe UI; padding:5px;"><b>' + title + '</b><br>' + details + '</div>'
        });

        marker.addListener('click', function() {
            infoWindow.open(map, marker);
            infoBox.innerText = title + " Seçildi";
        });
    }
</script>

</body>
</html>
