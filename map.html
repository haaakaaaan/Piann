<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piann - Interactive Network Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #f4f6f9; }

        .search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 500px;
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .search-container input {
            border: none;
            width: 100%;
            padding: 10px;
            font-size: 18px;
            outline: none;
        }

        /* Bilgi Kutusu (Sağ Üstteki LinkedIn/Sahibinden Tarzı Panel) */
        .info-box {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .glow-marker {
            width: 14px;
            height: 14px;
            background-color: #ff4757; /* İlanlar veya kullanıcılar için kırmızı parlayan nokta */
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff4757;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="search-container">
    <input type="text" placeholder="İl, ilçe veya meslek ara...">
</div>

<div class="info-box" id="infoBox">Haritada bir bölgeye yaklaşın</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1. Haritayı Türkiye merkezli başlatıyoruz
    var map = L.map('map').setView([39.0, 35.0], 6);

    // Temiz ve sade alt zemin (CartoDB Light)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; Piann'
    }).addTo(map);

    var regionLayer;

    // 2. Varsayılan Sınır Çizgisi Stili (Videodaki mavi dumanlı stil)
    function defaultStyle(feature) {
        return {
            fillColor: '#1877f2',
            weight: 1.5,
            opacity: 1,
            color: 'white',
            dashArray: '3',
            fillOpacity: 0.2
        };
    }

    // 3. Fare Üzerine Gelince Tetiklenen Parlama (Hover efekti)
    function highlightFeature(e) {
        var layer = e.target;
        layer.setStyle({
            fillColor: '#0a66c2', /* LinkedIn Mavisi */
            weight: 2.5,
            color: '#fff',
            dashArray: '',
            fillOpacity: 0.4
        });
        layer.bringToFront();
        
        // Sağ üstteki bilgi kutusunu güncelle
        document.getElementById('infoBox').innerText = layer.feature.properties.name || "Bilinmeyen Bölge";
    }

    function resetHighlight(e) {
        regionLayer.resetStyle(e.target);
    }

    // 4. Tıklayınca O Bölgeye Doğru Uçuş (Zoom / Yakınlaşma)
    function zoomToFeature(e) {
        map.fitBounds(e.target.getBounds());
    }

    function onEachFeature(feature, layer) {
        layer.on({
            mouseover: highlightFeature,
            mouseout: resetHighlight,
            click: zoomToFeature
        });
    }

    // 5. TÜRKİYE TÜM BÖLGE VE İL SINIRLARINI (GEOJSON) DIŞARIDAN ÇEKİYORUZ
    // İnternet üzerindeki güvenli ve hazır Türkiye harita sınır dosyasını doğrudan yüklüyoruz.
    // Bu sayede o uydurma dikdörtgenler gidiyor, yerine gerçek harita sınırları geliyor.
    fetch('https://raw.githubusercontent.com/subat/turkey-geojson/master/admin2.json')
        .then(response => response.json())
        .then(data => {
            regionLayer = L.geoJson(data, {
                style: defaultStyle,
                onEachFeature: onEachFeature
            }).addTo(map);
        })
        .catch(err => console.error("Harita sınırları yüklenirken hata oluştu:", err));

    // 6. Örnek Birkaç Tane Parlayan Nokta (Örn: Çerkezköy ve İstanbul)
    var customIcon = L.divIcon({ className: 'glow-marker' });
    
    // Çerkezköy koordinatı
    L.marker([41.2912, 28.0017], {icon: customIcon}).addTo(map)
        .bindPopup("<b>Hakan</b><br>Üretim Mühendisi<br>Fibertex - Çerkezköy");

    // İstanbul Merkez koordinatı
    L.marker([41.0082, 28.9784], {icon: customIcon}).addTo(map)
        .bindPopup("<b>Ahmet Yılmaz</b><br>Yazılım Geliştirici<br>Piann Merkez");
</script>

</body>
</html>
